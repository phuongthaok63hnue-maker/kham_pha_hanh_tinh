<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Khám Phá Hành Tinh - Toán Lớp 1</title>
    <style>
        :root {
            --primary: #4CAF50;
            --hover: #45a049;
            --bg: #0f172a;
            --text: #ffffff;
            --panel: rgba(30, 41, 59, 0.92);
            --star-color: #fcd34d;
        }
        * { 
            box-sizing: border-box; 
            user-select: none; 
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent; 
        }
        html, body { 
            margin: 0; 
            padding: 0; 
            background-color: var(--bg); 
            color: var(--text); 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            width: 100%; 
            min-height: 100vh; 
            overflow-x: hidden;
        }
        
        /* Space Background Elements */
        .background {
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            z-index: -2;
            background: radial-gradient(circle at 50% 100%, #1e1b4b, #0f172a);
        }
        .stars {
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            z-index: -1;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, #eee, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 40px 70px, #fff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 50px 160px, #ddd, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 90px 40px, #fff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 130px 80px, #fff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 160px 120px, #ddd, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 200px 200px;
            animation: stars 100s linear infinite;
        }
        @keyframes stars { from { background-position: 0 0; } to { background-position: -10000px 5000px; } }
        
        /* Layout Structure */
        .screen { 
            display: none; 
            width: 100%; 
            min-height: 100vh; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            text-align: center; 
            position: relative; 
            padding: 20px 15px; 
            box-sizing: border-box;
        }
        .screen.active { display: flex; }
        
        /* Start Screen */
        .title { 
            font-size: clamp(26px, 6vw, 48px); 
            font-weight: bold; 
            color: var(--star-color); 
            margin-bottom: 10px; 
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5); 
            line-height: 1.2;
        }
        .subtitle { 
            font-size: clamp(15px, 3.5vw, 24px); 
            margin-bottom: 25px; 
            color: #cbd5e1; 
            padding: 0 10px;
        }
        
        .btn { 
            padding: clamp(10px, 2.5vw, 15px) clamp(24px, 5vw, 40px); 
            font-size: clamp(18px, 4vw, 28px); 
            cursor: pointer; 
            border-radius: 50px; 
            border: 3px solid #fff; 
            background: var(--primary); 
            color: white; 
            font-weight: bold; 
            box-shadow: 0 6px 0 #2e7d32, 0 10px 20px rgba(0,0,0,0.3); 
            transition: all 0.1s;
            margin: 10px; 
            min-width: 180px; 
            max-width: 90%;
            touch-action: manipulation;
        }
        .btn:active { transform: translateY(6px); box-shadow: 0 0 0 #2e7d32; }
        
        /* HUD Bar */
        .hud { 
            width: 100%; 
            max-width: 900px; 
            display: flex; 
            justify-content: space-around; 
            align-items: center;
            font-size: clamp(14px, 3vw, 22px); 
            font-weight: bold; 
            z-index: 10;
            background: var(--panel); 
            padding: 10px 15px; 
            border-radius: 20px; 
            border: 2px solid #334155;
            margin-bottom: 15px; 
            gap: 10px; 
            flex-wrap: wrap;
        }
        
        /* Question Box */
        .question-box {
            background: var(--panel); 
            border-radius: 20px; 
            padding: clamp(15px, 3vw, 30px) clamp(10px, 2vw, 20px); 
            border: 3px solid #475569;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
            margin-bottom: 15px; 
            width: 100%; 
            max-width: 900px;
        }
        .prompt-text { 
            font-size: clamp(18px, 4.2vw, 32px); 
            font-weight: bold; 
            margin-bottom: 15px; 
            color: #f8fafc; 
            line-height: 1.35;
        }
        .visual-container { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: clamp(6px, 2vw, 15px); 
            margin-bottom: 15px; 
            flex-wrap: wrap; 
        }
        .group-box { 
            display: flex; 
            align-items: center; 
            justify-content: center;
            gap: 4px; 
            background: rgba(15, 23, 42, 0.6); 
            padding: 6px 12px; 
            border-radius: 12px; 
            border: 1px dashed #64748b; 
            flex-wrap: wrap; 
            max-width: 100%;
        }
        .star-icon { 
            width: clamp(22px, 5.5vw, 32px); 
            height: clamp(22px, 5.5vw, 32px); 
            fill: #fcd34d; 
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); 
        }
        .symbol-text { 
            font-size: clamp(24px, 6vw, 36px); 
            font-weight: bold; 
            color: #38bdf8; 
        }
        .expression { 
            font-size: clamp(28px, 7.5vw, 56px); 
            font-weight: bold; 
            letter-spacing: 2px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: clamp(8px, 2vw, 15px); 
            flex-wrap: wrap;
        }
        
        .drop-zone {
            display: inline-flex; 
            align-items: center; 
            justify-content: center;
            width: clamp(55px, 14vw, 80px); 
            height: clamp(55px, 14vw, 80px); 
            border: 3px dashed var(--star-color); 
            border-radius: 15px; 
            background: rgba(0,0,0,0.4); 
            color: #fff; 
            font-size: clamp(28px, 7vw, 48px); 
            text-align: center;
        }
        .drop-zone.filled { border-style: solid; background: #1e293b; }
        
        .options-grid { 
            display: flex; 
            gap: clamp(8px, 2.5vw, 20px); 
            justify-content: center; 
            flex-wrap: wrap; 
            margin-top: 10px; 
            width: 100%; 
            max-width: 900px; 
        }
        
        .draggable {
            width: clamp(62px, 16vw, 80px); 
            height: clamp(62px, 16vw, 80px); 
            background: linear-gradient(135deg, #3b82f6, #2563eb); 
            color: white; 
            font-size: clamp(28px, 7.5vw, 48px); 
            font-weight: bold; 
            border-radius: 15px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            cursor: pointer;
            border: 3px solid #60a5fa; 
            box-shadow: 0 4px 0 #1d4ed8; 
            transition: transform 0.15s, background 0.2s;
            touch-action: manipulation;
        }
        .draggable:active { transform: scale(0.95); }
        .draggable.sortable { 
            width: auto; 
            padding: 0 clamp(12px, 3.5vw, 22px); 
            font-size: clamp(20px, 5.5vw, 36px); 
            min-height: clamp(50px, 12vw, 65px); 
            height: auto;
        }
        
        .sort-container {
            display: flex; 
            gap: 10px; 
            background: rgba(0,0,0,0.3); 
            padding: 12px; 
            border-radius: 15px; 
            border: 2px solid #475569;
            min-height: 75px; 
            align-items: center; 
            justify-content: center; 
            margin-top: 15px; 
            flex-wrap: wrap; 
            width: 100%;
        }
        
        #feedback-msg { 
            font-size: clamp(18px, 4.5vw, 28px); 
            font-weight: bold; 
            min-height: 35px; 
            margin-top: 10px; 
            color: var(--star-color); 
            text-shadow: 1px 1px 2px #000; 
            padding: 0 10px;
        }
        
        /* Journey Progress Bar */
        .journey-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            height: 50px;
            margin-top: 15px;
            z-index: 5;
            padding: 0 25px;
            box-sizing: border-box;
        }
        .journey-track-bg {
            position: absolute; top: 50%; left: 25px; right: 25px; height: 8px; 
            background: #334155; border-radius: 4px; transform: translateY(-50%);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
        }
        .journey-track-fill {
            position: absolute; top: 50%; left: 25px; width: 0%; height: 8px;
            background: linear-gradient(90deg, #38bdf8, #818cf8); border-radius: 4px;
            transform: translateY(-50%); transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 10px #38bdf8;
            max-width: calc(100% - 50px);
        }
        .planet {
            position: absolute; top: 50%; width: clamp(30px, 7.5vw, 46px); height: clamp(30px, 7.5vw, 46px); border-radius: 50%;
            transform: translate(-50%, -50%); border: 3px solid #1e293b;
            box-shadow: 0 0 10px rgba(0,0,0,0.8); z-index: 2;
            transition: all 0.4s ease;
        }
        .planet.reached { border-color: #fcd34d; box-shadow: 0 0 20px #fcd34d; transform: translate(-50%, -50%) scale(1.15); }
        .pl-1 { left: calc(25px + 25% * (1 - 50px / 100%)); background: radial-gradient(circle at 30% 30%, #4ade80, #14532d); }
        .pl-2 { left: calc(25px + 50% * (1 - 50px / 100%)); background: radial-gradient(circle at 30% 30%, #c084fc, #581c87); }
        .pl-3 { left: calc(25px + 75% * (1 - 50px / 100%)); background: radial-gradient(circle at 30% 30%, #f472b6, #831843); }
        .pl-4 { left: calc(100% - 25px); background: radial-gradient(circle at 30% 30%, #fcd34d, #78350f); }
        
        .mini-ship-icon {
            position: absolute; top: 50%; left: 25px; width: clamp(34px, 8.5vw, 50px); height: clamp(34px, 8.5vw, 50px);
            transform: translate(-50%, -50%) rotate(90deg);
            z-index: 3; transition: left 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            filter: drop-shadow(0 4px 5px rgba(0,0,0,0.5));
        }

        /* Controls Panel */
        .controls { 
            display: flex; gap: 10px; align-items: center; 
            background: rgba(0,0,0,0.4); padding: 6px 14px; border-radius: 30px;
            margin-top: 15px; border: 1px solid #334155;
        }
        .icon-btn { 
            width: clamp(38px, 9vw, 46px); 
            height: clamp(38px, 9vw, 46px); 
            border-radius: 50%; border: 2px solid #fff; 
            background: #334155; color: #fff; font-size: clamp(16px, 4vw, 22px); cursor: pointer;
            display: flex; align-items: center; justify-content: center; transition: 0.2s;
            touch-action: manipulation;
        }
        .icon-btn:hover { background: #475569; }
        .volume-slider { width: clamp(60px, 15vw, 100px); cursor: pointer; }

        /* FX Animations */
        .celebration { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 100; overflow: hidden; display: none; }
        .star { position: absolute; width: 20px; height: 20px; background: var(--star-color); clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); }
        @keyframes floatUp { 0% { transform: translateY(100vh) rotate(0deg); opacity: 1; } 100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; } }

        /* RESPONSIVE MEDIA QUERIES */
        /* Mobile Portrait & Small Screens (< 600px) */
        @media (max-width: 600px) {
            .screen { padding: 12px 8px; justify-content: flex-start; }
            #screen-start { justify-content: center; }
            .question-box { padding: 15px 10px; margin-bottom: 10px; border-radius: 16px; }
            .hud { font-size: 13px; padding: 8px 10px; border-radius: 12px; margin-bottom: 10px; }
            .btn { padding: 10px 22px; min-width: 150px; }
            .journey-container { height: 40px; margin-top: 10px; padding: 0 18px; }
            .journey-track-bg { left: 18px; right: 18px; }
            .journey-track-fill { left: 18px; max-width: calc(100% - 36px); }
            .mini-ship-icon { left: 18px; }
            .pl-4 { left: calc(100% - 18px); }
            .controls { padding: 4px 10px; margin-top: 10px; }
        }

        /* Mobile Landscape (Xoay ngang màn hình nhỏ) */
        @media (max-height: 500px) and (orientation: landscape) {
            .screen { padding: 8px 10px; justify-content: flex-start; height: auto; min-height: 100vh; }
            #screen-start { justify-content: center; }
            .start-logo { width: 100px !important; height: 100px !important; margin-bottom: 5px !important; }
            .title { font-size: 22px; margin-bottom: 4px; }
            .subtitle { font-size: 13px; margin-bottom: 10px; }
            .hud { margin-bottom: 6px; padding: 4px 12px; font-size: 13px; }
            .question-box { padding: 10px; margin-bottom: 8px; }
            .prompt-text { font-size: 16px; margin-bottom: 6px; }
            .expression { font-size: 24px; gap: 6px; }
            .drop-zone { width: 44px; height: 44px; font-size: 22px; }
            .draggable { width: 48px; height: 48px; font-size: 22px; border-width: 2px; }
            .draggable.sortable { min-height: 38px; font-size: 16px; padding: 0 10px; }
            .sort-container { min-height: 50px; padding: 6px; margin-top: 6px; }
            .journey-container { height: 32px; margin-top: 6px; }
            .controls { margin-top: 6px; padding: 2px 8px; }
            .icon-btn { width: 32px; height: 32px; font-size: 14px; }
            #feedback-msg { font-size: 15px; min-height: 22px; margin-top: 4px; }
        }
    </style>
</head>
<body>
    <div class="background"></div>
    <div class="stars"></div>
    <div class="celebration" id="celebration"></div>

    <!-- MÀN HÌNH CHÍNH -->
    <div class="screen active" id="screen-start">
        <svg class="start-logo" width="180" height="180" viewBox="0 0 100 100" style="margin-bottom:15px; animation: bounce 2s infinite alternate;">
            <path d="M50 10 C30 30 20 60 20 80 L30 80 L50 95 L70 80 L80 80 C80 60 70 30 50 10 Z" fill="#e2e8f0"/>
            <path d="M50 10 C40 30 35 60 35 80 L50 95 L50 10 Z" fill="#cbd5e1"/>
            <circle cx="50" cy="45" r="12" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
            <circle cx="50" cy="45" r="10" fill="#38bdf8"/>
            <path d="M30 80 L20 100 L40 90 Z" fill="#ef4444"/>
            <path d="M70 80 L80 100 L60 90 Z" fill="#ef4444"/>
            <path d="M40 85 L50 105 L60 85 Z" fill="#fbbf24"/>
        </svg>
        <style>@keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-15px); } }</style>
        
        <div class="title">KHÁM PHÁ HÀNH TINH</div>
        <div class="subtitle">Trò chơi Toán học - Phép cộng phạm vi 10</div>
        <button class="btn" onclick="startGame()">BẮT ĐẦU CHƠI</button>
        
        <div class="controls" style="position: static; margin-top: 20px;">
            <button class="icon-btn" onclick="toggleFullscreen()" title="Toàn màn hình">⛶</button>
            <button class="icon-btn" id="btn-music-start" onclick="toggleMusic()" title="Bật/Tắt Nhạc">🎵</button>
            <input type="range" id="vol-start" class="volume-slider" min="0" max="1" step="0.1" value="0.4" onchange="changeVolume(this.value)">
        </div>
    </div>

    <!-- MÀN HÌNH CHƠI -->
    <div class="screen" id="screen-game">
        <div class="hud">
            <div>Vòng: <span id="hud-round">1/4</span></div>
            <div>Câu: <span id="hud-question">1/16</span></div>
            <div>Điểm: <span id="hud-score">0</span></div>
        </div>
        
        <div class="question-box">
            <div class="prompt-text" id="question-prompt">Gộp lại bằng bao nhiêu?</div>
            <div class="visual-container" id="question-visual" style="display:none;"></div>
            <div class="expression" id="question-expression">
                <!-- Nội dung câu hỏi sinh tự động -->
            </div>
            
            <div id="sort-zone" class="sort-container" style="display:none;">
                <!-- Khung sắp xếp -->
            </div>
        </div>
        
        <div class="options-grid" id="options-container">
            <!-- Các đáp án sinh tự động -->
        </div>
        
        <div id="feedback-msg"></div>
        <button class="btn" id="btn-next" style="display:none; margin-top: 12px; background: #f59e0b; box-shadow: 0 6px 0 #b45309;" onclick="nextQuestion()">TIẾP TỤC ➔</button>

        <!-- THANH HÀNH TRÌNH TÀU VŨ TRỤ -->
        <div class="journey-container">
            <div class="journey-track-bg"></div>
            <div class="journey-track-fill" id="journey-fill"></div>
            <div class="planet pl-1" id="planet-1" title="Vòng 1"></div>
            <div class="planet pl-2" id="planet-2" title="Vòng 2"></div>
            <div class="planet pl-3" id="planet-3" title="Vòng 3"></div>
            <div class="planet pl-4" id="planet-4" title="Vòng 4"></div>
            <svg class="mini-ship-icon" id="mini-ship" viewBox="0 0 100 100">
                <path d="M50 5 C35 25 25 55 25 75 L35 75 L50 90 L65 75 L75 75 C75 55 65 25 50 5 Z" fill="#f8fafc"/>
                <path d="M50 5 C42 25 38 55 38 75 L50 90 L50 5 Z" fill="#cbd5e1"/>
                <circle cx="50" cy="40" r="14" fill="#0f172a" stroke="#38bdf8" stroke-width="3"/>
                <path d="M35 75 L20 95 L45 85 Z" fill="#ef4444"/>
                <path d="M65 75 L80 95 L55 85 Z" fill="#ef4444"/>
                <path d="M42 80 L50 105 L58 80 Z" fill="#fbbf24"/>
                <path d="M45 80 L50 100 L55 80 Z" fill="#f97316"/>
            </svg>
        </div>

        <div class="controls">
            <button class="icon-btn" onclick="toggleFullscreen()">⛶</button>
            <button class="icon-btn" id="btn-music-game" onclick="toggleMusic()">🎵</button>
            <input type="range" id="vol-game" class="volume-slider" min="0" max="1" step="0.1" value="0.4" onchange="changeVolume(this.value)">
        </div>
    </div>

    <!-- MÀN HÌNH KẾT THÚC -->
    <div class="screen" id="screen-end">
        <div class="title">CHÚC MỪNG PHI HÀNH GIA!</div>
        <div class="subtitle">Bạn đã khám phá thành công tất cả các hành tinh.</div>
        <div style="font-size: clamp(28px, 6vw, 40px); margin: 15px; color: #4ade80; font-weight: bold;">Tổng điểm: <span id="final-score">0</span></div>
        <div style="font-size: clamp(18px, 4vw, 28px); margin-bottom: 30px;">Số câu trả lời đúng ngay lần đầu: <span id="final-correct">0</span>/16</div>
        <button class="btn" onclick="resetGame()">CHƠI LẠI</button>
    </div>

    <script>
        /* ==========================================================
           CẤU HÌNH VÀ DỮ LIỆU CÂU HỎI
           ========================================================== */
        const GAME_CONFIG = {
            totalRounds: 4,
            questionsPerRound: 4,
            points: { firstTry: 10, secondTry: 7, thirdTry: 5 },
            musicVolume: 0.4,
            shuffle: false 
        };

        const QUESTIONS = [
            // VÒNG 1: KHÁM PHÁ HÀNH TINH XANH
            { id: 1, round: 1, type: "choose", prompt: "Quan sát và cho biết: Gộp 3 ngôi sao và 2 ngôi sao được mấy ngôi sao?", visual: { group1: 3, symbol: "+", group2: 2 }, expression: "3 + 2 = [?]", options: ["4", "5", "6", "7"], correctAnswer: "5" },
            { id: 2, round: 1, type: "choose", prompt: "Thêm vào để tìm kết quả phép tính sau:", visual: { group1: 4, symbol: "+", group2: 1 }, expression: "4 + 1 = [?]", options: ["3", "4", "5", "6"], correctAnswer: "5" },
            { id: 3, round: 1, type: "choose", prompt: "Đếm tất cả các ngôi sao để tìm kết quả:", visual: { group1: 5, symbol: "+", group2: 3 }, expression: "5 + 3 = [?]", options: ["7", "8", "9", "10"], correctAnswer: "8" },
            { id: 4, round: 1, type: "choose", prompt: "Chọn kết quả đúng cho phép cộng sau:", expression: "2 + 6 = [?]", options: ["6", "7", "8", "9"], correctAnswer: "8" },

            // VÒNG 2: VƯỢT THIÊN THẠCH HÀNH TINH TÍM
            { id: 5, round: 2, type: "drag", prompt: "Chọn số còn thiếu điền vào ô trống:", expression: "[?] + 4 = 8", options: ["3", "4", "5", "6"], correctAnswer: "4" },
            { id: 6, round: 2, type: "drag", prompt: "Tính giá trị biểu thức (từ trái sang phải):", expression: "4 + 1 + 3 = [?]", options: ["7", "8", "9", "10"], correctAnswer: "8" },
            { id: 7, round: 2, type: "drag", prompt: "Tìm số còn thiếu ở giữa:", expression: "5 + [?] + 1 = 9", options: ["2", "3", "4", "5"], correctAnswer: "3" },
            { id: 8, round: 2, type: "drag", prompt: "Tìm số đầu tiên còn thiếu:", expression: "[?] + 2 + 2 = 8", options: ["2", "3", "4", "5"], correctAnswer: "4" },

            // VÒNG 3: VƯỢT HỐ ĐEN HÀNH TINH HỒNG
            { id: 9, round: 3, type: "compare", prompt: "Tính rồi chọn dấu thích hợp ( >, <, = ):", expression: "3 + 2 [?] 5", options: [">", "<", "="], correctAnswer: "=" },
            { id: 10, round: 3, type: "compare", prompt: "Tính rồi chọn dấu thích hợp ( >, <, = ):", expression: "4 + 3 [?] 8", options: [">", "<", "="], correctAnswer: "<" },
            { id: 11, round: 3, type: "compare", prompt: "So sánh tổng hai dấu cộng với một số:", expression: "4 + 1 + 3 [?] 7", options: [">", "<", "="], correctAnswer: ">" },
            { id: 12, round: 3, type: "compare", prompt: "So sánh kết quả của hai vế phép tính:", expression: "5 + 4 [?] 2 + 7", options: [">", "<", "="], correctAnswer: "=" },

            // VÒNG 4: CHINH PHỤC HÀNH TINH VÀNG
            { id: 13, round: 4, type: "sort", prompt: "Bấm chọn để xếp các số sau theo thứ tự từ BÉ đến LỚN:", items: ["9", "4", "8", "5"], correctAnswer: "4,5,8,9" },
            { id: 14, round: 4, type: "sort", prompt: "Bấm chọn để xếp các số sau theo thứ tự từ LỚN đến BÉ:", items: ["2", "7", "5", "10"], correctAnswer: "10,7,5,2" },
            { id: 15, round: 4, type: "sort", prompt: "Tính nhẩm rồi xếp các phép tính từ BÉ đến LỚN:", items: ["2+1", "1+1", "4+2", "3+2"], correctAnswer: "1+1,2+1,3+2,4+2" },
            { id: 16, round: 4, type: "sort", prompt: "Tính nhẩm rồi xếp các phép tính từ LỚN đến BÉ:", items: ["5+5", "2+2", "3+4", "4+5"], correctAnswer: "5+5,4+5,3+4,2+2" }
        ];

        const PRAISE_WORDS = ["Chính xác!", "Giỏi lắm!", "Tuyệt vời!", "Em làm rất tốt!"];
        const ENCOURAGE_WORDS = ["Em hãy thử lại nhé", "Gần đúng rồi", "Hãy quan sát kỹ hơn"];

        /* ==========================================================
           LOGIC TRÒ CHƠI
           ========================================================== */
        let currentQuestions = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let perfectAnswers = 0;
        let attemptsForCurrent = 0;
        let isMusicPlaying = false;
        let audioCtx;
        let musicInterval;
        let answeredCorrectly = false;
        
        function initAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSound(type) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            const now = audioCtx.currentTime;
            if (type === 'correct') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.setValueAtTime(659.25, now + 0.1);
                osc.frequency.setValueAtTime(783.99, now + 0.2);
                gain.gain.setValueAtTime(0, now);
                gain.gain.linearRampToValueAtTime(GAME_CONFIG.musicVolume, now + 0.05);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                osc.start(now);
                osc.stop(now + 0.5);
            } else if (type === 'wrong') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.linearRampToValueAtTime(200, now + 0.3);
                gain.gain.setValueAtTime(GAME_CONFIG.musicVolume * 0.8, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            }
        }

        function toggleMusic() {
            initAudio();
            isMusicPlaying = !isMusicPlaying;
            document.getElementById('btn-music-start').innerText = isMusicPlaying ? '🎵' : '🔇';
            document.getElementById('btn-music-game').innerText = isMusicPlaying ? '🎵' : '🔇';
            
            if (isMusicPlaying) {
                const notes = [261.63, 329.63, 392.00, 523.25, 392.00, 329.63];
                let noteIdx = 0;
                musicInterval = setInterval(() => {
                    if(!isMusicPlaying || audioCtx.state !== 'running') return;
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.value = notes[noteIdx];
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    gain.gain.setValueAtTime(0, audioCtx.currentTime);
                    gain.gain.linearRampToValueAtTime(GAME_CONFIG.musicVolume * 0.4, audioCtx.currentTime + 0.05);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.4);
                    noteIdx = (noteIdx + 1) % notes.length;
                }, 400);
            } else {
                clearInterval(musicInterval);
            }
        }

        function changeVolume(val) {
            GAME_CONFIG.musicVolume = parseFloat(val);
            document.getElementById('vol-start').value = val;
            document.getElementById('vol-game').value = val;
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => console.log(err));
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        }

        function startGame() {
            initAudio();
            if (!isMusicPlaying) toggleMusic();
            
            document.getElementById('screen-start').classList.remove('active');
            document.getElementById('screen-game').classList.add('active');
            
            document.getElementById('journey-fill').style.width = '0%';
            document.getElementById('mini-ship').style.left = '0%';
            for(let i=1; i<=4; i++) {
                document.getElementById('planet-'+i).classList.remove('reached');
            }

            currentQuestions = JSON.parse(JSON.stringify(QUESTIONS));
            if (GAME_CONFIG.shuffle) {
                currentQuestions.sort(() => Math.random() - 0.5);
            }

            currentQuestionIndex = 0;
            score = 0;
            perfectAnswers = 0;
            loadQuestion();
        }

        function resetGame() {
            document.getElementById('screen-end').classList.remove('active');
            document.getElementById('screen-start').classList.add('active');
        }

        function loadQuestion() {
            if (currentQuestionIndex >= currentQuestions.length) {
                showEndScreen();
                return;
            }
            
            const q = currentQuestions[currentQuestionIndex];
            attemptsForCurrent = 0;
            answeredCorrectly = false;
            
            const currentRound = q.round;
            document.getElementById('hud-round').innerText = `${currentRound}/${GAME_CONFIG.totalRounds}`;
            document.getElementById('hud-question').innerText = `${currentQuestionIndex + 1}/${currentQuestions.length}`;
            document.getElementById('hud-score').innerText = score;
            
            document.getElementById('question-prompt').innerText = q.prompt;
            document.getElementById('feedback-msg').innerText = '';
            document.getElementById('btn-next').style.display = 'none';
            
            const visualContainer = document.getElementById('question-visual');
            const exprContainer = document.getElementById('question-expression');
            const optsContainer = document.getElementById('options-container');
            const sortZone = document.getElementById('sort-zone');
            
            visualContainer.innerHTML = '';
            visualContainer.style.display = 'none';
            exprContainer.innerHTML = '';
            optsContainer.innerHTML = '';
            sortZone.style.display = 'none';
            sortZone.innerHTML = '';
            
            if (q.visual) {
                visualContainer.style.display = 'flex';
                const starSvg = `<svg class="star-icon" viewBox="0 0 24 24"><polygon points="12,2 15,8.5 22,9.3 17,14 18.5,21 12,17.3 5.5,21 7,14 2,9.3 9,8.5" /></svg>`;
                
                let g1Html = '<div class="group-box">';
                for(let i=0; i<q.visual.group1; i++) g1Html += starSvg;
                g1Html += '</div>';
                
                let symHtml = `<div class="symbol-text">${q.visual.symbol}</div>`;
                
                let g2Html = '<div class="group-box">';
                for(let i=0; i<q.visual.group2; i++) g2Html += starSvg;
                g2Html += '</div>';
                
                visualContainer.innerHTML = g1Html + symHtml + g2Html;
            }
            
            if (q.type === 'sort') {
                exprContainer.style.display = 'none';
                sortZone.style.display = 'flex';
                let items = [...q.items];
                items.sort(() => Math.random() - 0.5);
                
                items.forEach((item) => {
                    const el = document.createElement('div');
                    el.className = 'draggable sortable';
                    el.innerText = item;
                    el.onclick = () => handleSortClick(el);
                    optsContainer.appendChild(el);
                });
            } else {
                exprContainer.style.display = 'flex';
                const parts = q.expression.split('[?]');
                if (parts.length === 2) {
                    exprContainer.innerHTML = `<span>${parts[0]}</span><div class="drop-zone" id="the-drop-zone">?</div><span>${parts[1]}</span>`;
                } else {
                    exprContainer.innerHTML = `<span>${q.expression}</span>`;
                }
                
                let opts = [...q.options];
                opts.forEach(opt => {
                    const btn = document.createElement('div');
                    btn.className = 'draggable';
                    btn.innerText = opt;
                    btn.onclick = () => handleAnswerSelect(opt, btn);
                    optsContainer.appendChild(btn);
                });
            }
        }

        function handleAnswerSelect(selected, element) {
            if (answeredCorrectly) return;
            const q = currentQuestions[currentQuestionIndex];
            
            const dz = document.getElementById('the-drop-zone');
            if (dz) {
                dz.innerText = selected;
                dz.classList.add('filled');
            }
            
            if (selected === q.correctAnswer) {
                processCorrectAnswer(element);
            } else {
                handleWrong(element);
                if (dz) {
                    setTimeout(() => { 
                        if (!answeredCorrectly) { dz.innerText = '?'; dz.classList.remove('filled'); }
                    }, 1000);
                }
            }
        }

        let currentSorted = [];
        function handleSortClick(element) {
            if (answeredCorrectly) return;
            const sortZone = document.getElementById('sort-zone');
            const optsContainer = document.getElementById('options-container');
            
            if (element.parentElement === optsContainer) {
                sortZone.appendChild(element);
                currentSorted.push(element.innerText);
            } else {
                optsContainer.appendChild(element);
                currentSorted = currentSorted.filter(v => v !== element.innerText);
            }
            
            const q = currentQuestions[currentQuestionIndex];
            if (currentSorted.length === q.items.length) {
                if (currentSorted.join(',') === q.correctAnswer) {
                    processCorrectAnswer(null);
                } else {
                    handleWrong(null);
                    setTimeout(() => {
                        if (!answeredCorrectly) {
                            Array.from(sortZone.children).forEach(child => optsContainer.appendChild(child));
                            currentSorted = [];
                        }
                    }, 1000);
                }
            }
        }

        function processCorrectAnswer(element) {
            answeredCorrectly = true;
            playSound('correct');
            createStars();
            
            let pts = 0;
            if (attemptsForCurrent === 0) { pts = GAME_CONFIG.points.firstTry; perfectAnswers++; }
            else if (attemptsForCurrent === 1) pts = GAME_CONFIG.points.secondTry;
            else pts = GAME_CONFIG.points.thirdTry;
            
            score += pts;
            document.getElementById('hud-score').innerText = score;
            
            const totalQ = currentQuestions.length;
            const currentQNumber = currentQuestionIndex + 1;
            const progressPercent = (currentQNumber / totalQ) * 100;
            
            document.getElementById('journey-fill').style.width = progressPercent + '%';
            document.getElementById('mini-ship').style.left = progressPercent + '%';
            
            const questionsPerRound = totalQ / GAME_CONFIG.totalRounds;
            if (currentQNumber % questionsPerRound === 0) {
                const roundCompleted = currentQNumber / questionsPerRound;
                if(roundCompleted <= 4) {
                    setTimeout(() => {
                        document.getElementById('planet-' + roundCompleted).classList.add('reached');
                    }, 800);
                }
            }

            const praise = PRAISE_WORDS[Math.floor(Math.random() * PRAISE_WORDS.length)];
            document.getElementById('feedback-msg').innerText = `${praise} (+${pts} điểm)`;
            document.getElementById('feedback-msg').style.color = '#4ade80';
            
            if(element) element.style.background = '#4ade80';
            
            const draggables = document.querySelectorAll('.draggable');
            draggables.forEach(d => { d.style.cursor = 'default'; d.onclick = null; });
            
            document.getElementById('btn-next').style.display = 'inline-block';
        }

        function handleWrong(element) {
            attemptsForCurrent++;
            playSound('wrong');
            
            const enc = ENCOURAGE_WORDS[Math.floor(Math.random() * ENCOURAGE_WORDS.length)];
            document.getElementById('feedback-msg').innerText = enc;
            document.getElementById('feedback-msg').style.color = '#f87171';
            
            if(element) {
                const oldBg = element.style.background;
                element.style.background = '#ef4444';
                setTimeout(() => { if (!answeredCorrectly) element.style.background = oldBg; }, 800);
            }
        }

        function nextQuestion() {
            currentQuestionIndex++;
            currentSorted = [];
            document.getElementById('celebration').style.display = 'none';
            document.getElementById('celebration').innerHTML = '';
            loadQuestion();
        }

        function showEndScreen() {
            document.getElementById('screen-game').classList.remove('active');
            document.getElementById('screen-end').classList.add('active');
            document.getElementById('final-score').innerText = score;
            document.getElementById('final-correct').innerText = perfectAnswers;
        }

        function createStars() {
            const container = document.getElementById('celebration');
            container.style.display = 'block';
            container.innerHTML = '';
            for (let i = 0; i < 30; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + 'vw';
                star.style.background = ['#fcd34d', '#4ade80', '#38bdf8', '#f87171'][Math.floor(Math.random()*4)];
                star.style.animation = `floatUp ${1 + Math.random()*2}s ease-in forwards`;
                container.appendChild(star);
            }
        }
    </script>
</body>
</html>
